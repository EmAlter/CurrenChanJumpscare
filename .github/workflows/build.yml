name: Build and Publish Release

on:
  push:
    tags:
      - 'v*' # Triggers automatically when a tag is pushed (e.g., v1.0.0)
  workflow_dispatch:

permissions:
  contents: write # Required permission to create the GitHub release

jobs:
  build-and-release:
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Build Framework-Dependent Version (Lightweight)
      run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./output/framework-dependent
      
    - name: Build Self-Contained Version (Complete)
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o ./output/self-contained
      
    - name: Create ZIP Archives
      run: |
        Compress-Archive -Path ./output/framework-dependent/* -DestinationPath CurrenChanJumpscare-FrameworkDependent.zip
        Compress-Archive -Path ./output/self-contained/* -DestinationPath CurrenChanJumpscare-SelfContained.zip
        
    - name: Create Release and Upload ZIPs
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
        generate_release_notes: true
        files: |
          CurrenChanJumpscare-FrameworkDependent.zip
          CurrenChanJumpscare-SelfContained.zip